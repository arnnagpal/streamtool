plugins {
    id 'application'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'application'
}

project(':common') {
    repositories {
        mavenCentral()
    }
    

    sourceSets {
        main {
            java {
                srcDir '../src'
                include 'common/**'
            }
        }
    }

    dependencies {
        implementation 'org.json:json:20260814'
        implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    }

    application {
        mainClass = 'common.Main'
    }

    jar {

        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes "Main-Class": "common.Main"
        }

        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
}

project(':app') {
    repositories {
        mavenCentral()
        maven { url 'https://forgejo.arnagpal.dev/api/packages/aryan/maven' }
    }

    sourceSets {
        main {
            java {
                srcDir '../src'
                include 'streamtool/**'
            }
        }
    }

    dependencies {
        implementation 'org.json:json:20260814'
        implementation 'org.java-websocket:Java-WebSocket:1.6.0'
        implementation project(':common')
        implementation 'dev.arnagpal:perch-timer:0.1.2'
    }

    application {
        mainClass = 'streamtool.Main'
    }

    jar {

        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes "Main-Class": "streamtool.Main"
        }

        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
}

project(':scoreboard') {
    repositories {
        mavenCentral()
    }

    sourceSets {
        main {
            java {
                srcDir '../src'
                include 'scoreboard/**'
            }
        }
    }


    dependencies {
        implementation project(':common')
    }

    application {
        mainClass = 'scoreboard.Main'
    }

    jar {

        duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        manifest {
            attributes "Main-Class": "scoreboard.Main"
        }

        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
}
